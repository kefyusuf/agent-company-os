normative_fixes:
- id: FIX-01
  topic: Report review
  decision: Submitted report version is immutable; Review is the authoritative acceptance decision.
- id: FIX-02
  topic: Assignment/accountability
  decision: ReassignTask and TransferAccountability are distinct authorized commands.
- id: FIX-03
  topic: Activation readiness
  decision: activation_ready is a validation result, not a Company state.
- id: FIX-04
  topic: Tenant-bound identity
  decision: AgentIdentity belongs to one company; runtime and model may be shared.
- id: FIX-05
  topic: Service requests
  decision: Cross-department ServiceRequest is linked to the requesting task and fulfilled through the target
    unit’s own task chain.
- id: FIX-06
  topic: Actor types
  decision: Agent, human and system_service are distinct authenticated actor kinds.
- id: FIX-07
  topic: Approval usage
  decision: Consumed approval binds to one operation attempt, not to success.
- id: FIX-08
  topic: Position occupancy
  decision: Reference model has at most one active primary appointment per Position.
- id: FIX-09
  topic: Knowledge verification
  decision: Accepted report does not automatically verify its claims.
- id: FIX-10
  topic: Unknown external result
  decision: Unknown operations require reconciliation before possible redispatch.
